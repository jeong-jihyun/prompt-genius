<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptGenius</title>
  <style>
    :root {
      --bg: #0f0f13; --bg2: #18181f; --bg3: #222230;
      --border: #2e2e3e; --text: #e8e8f0; --muted: #888898;
      --accent: #7F77DD; --accent2: #5DCAA5;
      --danger: #E24B4A; --warn: #EF9F27;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px; min-height: 520px; max-height: 600px;
      overflow-y: auto; background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 13px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      background: var(--bg2); position: sticky; top: 0; z-index: 10;
    }
    .logo { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
    .logo-icon { color: var(--accent); font-size: 16px; animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    nav { display: flex; gap: 4px; }
    .nav-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid transparent;
      background: none; color: var(--muted); cursor: pointer; font-size: 12px;
      font-family: var(--font); transition: all .15s;
    }
    .nav-btn:hover { color: var(--text); border-color: var(--border); }
    .nav-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(127,119,221,.1); }
    .view { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .field-label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
    .textarea {
      width: 100%; padding: 10px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); font-size: 13px; font-family: var(--font);
      resize: vertical; outline: none; line-height: 1.6; transition: border .15s;
    }
    .textarea:focus { border-color: var(--accent); }
    .input, .select {
      width: 100%; padding: 8px 10px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); font-size: 13px; font-family: var(--font);
      outline: none; transition: border .15s;
    }
    .input:focus, .select:focus { border-color: var(--accent); }
    .btn-primary {
      padding: 9px 16px; border-radius: 7px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; font-family: var(--font);
      background: var(--accent); color: #fff; transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary:hover { background: #6c64c8; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost {
      padding: 9px 16px; border-radius: 7px; background: none; color: var(--muted);
      border: 1px solid var(--border); cursor: pointer; font-size: 13px; font-family: var(--font);
      transition: all .15s;
    }
    .btn-ghost:hover { color: var(--text); }
    .btn-secondary {
      padding: 9px 16px; border-radius: 7px; background: var(--bg3); color: var(--text);
      border: 1px solid var(--border); cursor: pointer; font-size: 13px; font-family: var(--font);
      transition: all .15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: rgba(226,75,74,.12); border: 1px solid rgba(226,75,74,.3);
      border-radius: 7px; padding: 10px 12px; color: #f08080; font-size: 12px; line-height: 1.5;
    }
    /* Stepper */
    .stepper { display: flex; align-items: center; justify-content: center; padding: 4px 0 8px; }
    .step { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
    .step-dot {
      width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border);
      background: var(--bg3); color: var(--muted); font-size: 11px;
      display: flex; align-items: center; justify-content: center; font-weight: 600; transition: all .2s;
    }
    .step.active .step-dot { border-color: var(--accent); color: var(--accent); background: rgba(127,119,221,.15); }
    .step.done .step-dot { border-color: var(--accent2); color: var(--accent2); background: rgba(93,202,165,.15); }
    .step span { font-size: 10px; color: var(--muted); }
    .step.active span { color: var(--accent); }
    .step.done span { color: var(--accent2); }
    .step-line { position: absolute; top: 12px; left: calc(100% + 2px); width: 32px; height: 1px; background: var(--border); }
    .step.done .step-line { background: var(--accent2); }
    /* Library */
    .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg2); color: var(--muted); font-size: 11px; cursor: pointer;
      transition: all .15s; white-space: nowrap; font-family: var(--font);
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(127,119,221,.1); }
    .prompt-list { display: flex; flex-direction: column; gap: 8px; }
    .prompt-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px; transition: border .15s;
    }
    .prompt-card:hover { border-color: var(--accent); }
    .prompt-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .cat-badge { font-size: 11px; padding: 2px 8px; background: var(--bg3); border-radius: 20px; color: var(--muted); }
    .fav-btn { background: none; border: none; color: var(--border); cursor: pointer; font-size: 15px; transition: color .15s; }
    .fav-btn.on { color: var(--warn); }
    .prompt-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .prompt-preview { color: var(--muted); font-size: 12px; line-height: 1.5; margin-bottom: 10px; }
    .prompt-actions { display: flex; align-items: center; gap: 6px; }
    .usage { font-size: 11px; color: var(--muted); flex: 1; }
    .act-btn {
      padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg3); color: var(--text); cursor: pointer; font-size: 11px;
      font-weight: 600; font-family: var(--font); transition: all .15s;
    }
    .act-btn:hover { border-color: var(--accent); color: var(--accent); }
    .act-btn.inject { border-color: rgba(93,202,165,.4); color: var(--accent2); }
    .act-btn.del { color: var(--muted); }
    .act-btn.del:hover { border-color: rgba(226,75,74,.4); color: var(--danger); }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; line-height: 2; }
    /* Settings */
    .provider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .provider-btn {
      padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border);
      background: var(--bg3); color: var(--muted); cursor: pointer; font-size: 11px;
      font-family: var(--font); text-align: left; transition: all .15s; line-height: 1.4;
    }
    .provider-btn:hover { border-color: var(--accent); color: var(--text); }
    .provider-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(127,119,221,.1); }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.6; }
    .hint a { color: var(--accent); text-decoration: none; }
    .test-result {
      padding: 10px 12px; border-radius: 7px; font-size: 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .test-ok   { background: rgba(93,202,165,.1); border: 1px solid rgba(93,202,165,.3); color: var(--accent2); }
    .test-fail { background: rgba(226,75,74,.1); border: 1px solid rgba(226,75,74,.3); color: #f08080; }
    /* Field row */
    .field-row { display: flex; gap: 10px; }
    .field-row > * { flex: 1; }
  </style>
</head>
<body tabindex="0">
  <div id="root"></div>
  <script src="roles.js"></script>
  <script src="popup.js"></script>

<script>
// 팝업 로드 시 포커스 확보 — clipboard API는 document focus가 필요
window.addEventListener('load', function() {
  window.focus();
  document.body.focus();
});
</script>

</body>
</html>
<style>
/* ── 신규 v2 스타일 ─────────────────────────────── */
.warn-box {
  background:rgba(239,159,39,.1);border:1px solid rgba(239,159,39,.3);
  border-radius:7px;padding:10px 12px;color:#c8941a;font-size:12px;line-height:1.5;
}
.guide-toggle {
  background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;
  padding:0;font-family:var(--font);
}
.guide-toggle:hover{text-decoration:underline;}
.guide-panel {
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:12px;display:flex;flex-direction:column;gap:10px;
}
.guide-title{font-size:13px;font-weight:600;color:var(--text);}
.guide-steps{display:flex;flex-direction:column;gap:8px;}
.guide-step{display:flex;gap:10px;align-items:flex-start;}
.guide-num{
  width:22px;height:22px;border-radius:50%;background:rgba(127,119,221,.15);
  border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.guide-step-title{font-size:12px;font-weight:600;margin-bottom:2px;}
.guide-step-desc{font-size:11px;color:var(--muted);line-height:1.6;}
.guide-step-desc em{color:var(--text);font-style:normal;}
.guide-examples-title{font-size:11px;font-weight:600;color:var(--muted);}
.guide-examples{display:flex;flex-wrap:wrap;gap:5px;}
.example-chip{
  padding:5px 10px;border-radius:20px;border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:11px;cursor:pointer;
  font-family:var(--font);transition:all .15s;
}
.example-chip:hover{border-color:var(--accent);color:var(--accent);}
/* 프로바이더 가이드 */
.provider-guide-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;}
.provider-guide-steps{
  padding-left:16px;display:flex;flex-direction:column;gap:5px;
  font-size:12px;color:var(--muted);line-height:1.6;
}
.provider-guide-steps li{margin:0;}
.provider-guide-steps a{color:var(--accent);text-decoration:none;}
.provider-guide-steps a:hover{text-decoration:underline;}
.provider-guide-steps code{
  background:rgba(0,0,0,.25);padding:1px 5px;border-radius:3px;
  font-family:monospace;font-size:11px;color:var(--accent2);
}
.provider-guide-steps strong{color:var(--text);font-weight:600;}
.provider-note{
  margin-top:8px;font-size:11px;color:var(--muted);
  padding:6px 10px;background:rgba(127,119,221,.06);
  border-radius:6px;border-left:2px solid var(--accent);
}
/* 모델 선택 리스트 */
.model-list{display:flex;flex-direction:column;gap:4px;}
.model-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--bg3);border:1px solid var(--border);border-radius:7px;
  cursor:pointer;transition:border .15s;
}
.model-item:hover{border-color:var(--accent);}
.model-item.active{border-color:var(--accent);background:rgba(127,119,221,.1);}
.model-name{font-size:12px;font-weight:600;color:var(--text);flex:1;}
.model-note{font-size:11px;color:var(--muted);}
/* 감지된 모델 */
.detected-models{margin-top:8px;}
.detected-model-btn{
  padding:3px 8px;border-radius:12px;border:1px solid rgba(93,202,165,.4);
  background:rgba(93,202,165,.08);color:var(--accent2);font-size:11px;
  cursor:pointer;font-family:monospace;transition:all .15s;
}
.detected-model-btn:hover{background:rgba(93,202,165,.2);}
/* 커스텀 예시 */
.custom-examples{display:flex;flex-direction:column;gap:4px;margin-bottom:2px;}
.custom-ex-btn{
  display:flex;justify-content:space-between;align-items:center;
  padding:7px 10px;background:var(--bg3);border:1px solid var(--border);
  border-radius:7px;cursor:pointer;font-size:12px;font-family:var(--font);
  color:var(--text);transition:border .15s;text-align:left;
}
.custom-ex-btn:hover{border-color:var(--accent);}
/* 엑셀 바 */
.excel-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 0;
}
/* 테스트 결과 */
.test-result{padding:10px 12px;border-radius:7px;font-size:12px;line-height:1.6;}
.test-ok  {background:rgba(93,202,165,.1);border:1px solid rgba(93,202,165,.3);color:var(--accent2);}
.test-fail{background:rgba(226,75,74,.1); border:1px solid rgba(226,75,74,.3); color:#f08080;}
</style>
<style>

  background:rgba(0,0,0,.15);border-radius:7px;padding:10px;margin-top:8px;
}
.cors-os-tab {
  display:flex;gap:4px;margin-bottom:10px;
}
.cors-tab {
  padding:4px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg3);color:var(--muted);font-size:11px;cursor:pointer;
  font-family:var(--font);transition:all .15s;
}
.cors-tab.active {
  border-color:var(--accent);color:var(--accent);background:rgba(127,119,221,.1);
}
.cors-code {
  background:rgba(0,0,0,.3);border-radius:5px;padding:8px 10px;
  font-family:monospace;font-size:11px;color:var(--accent2);line-height:1.6;
  white-space:pre-wrap;word-break:break-all;
}
.copy-cmd-btn {
  margin-top:8px;padding:5px 10px;border-radius:6px;
  border:1px solid rgba(93,202,165,.4);background:rgba(93,202,165,.08);
  color:var(--accent2);font-size:11px;cursor:pointer;font-family:var(--font);
  transition:all .15s;display:block;width:100%;text-align:center;
}
.copy-cmd-btn:hover{background:rgba(93,202,165,.18);}
</style>
<style>
/* ── OS별 설치 가이드 ─────────────────────────────── */
.os-tab-bar {
  display:flex; gap:4px; margin-bottom:10px;
}
.os-tab {
  flex:1; padding:6px 4px; border-radius:7px;
  border:1px solid var(--border); background:var(--bg3);
  color:var(--muted); font-size:12px; cursor:pointer;
  font-family:var(--font); font-weight:500; transition:all .15s;
}
.os-tab:hover { border-color:var(--accent); color:var(--text); }
.os-tab.active {
  border-color:var(--accent); color:var(--accent);
  background:rgba(127,119,221,.12); font-weight:600;
}
.os-note {
  font-size:11px; color:var(--muted); margin-bottom:10px;
  padding:5px 10px; background:rgba(127,119,221,.06);
  border-radius:6px; border-left:2px solid var(--accent);
}
.os-steps { display:flex; flex-direction:column; gap:10px; }
.os-step {
  background:var(--bg3); border:1px solid var(--border);
  border-radius:8px; padding:10px 12px;
}
.os-step-title {
  font-size:12px; font-weight:600; color:var(--text); margin-bottom:4px;
}
.os-step-desc {
  font-size:11px; color:var(--muted); line-height:1.6; margin-bottom:6px;
}
.os-link {
  display:inline-block; font-size:11px; color:var(--accent);
  text-decoration:none; margin-bottom:6px;
}
.os-link:hover { text-decoration:underline; }
.os-step-note {
  font-size:11px; color:#c8941a; margin-top:6px; line-height:1.5;
  padding:5px 8px; background:rgba(239,159,39,.08);
  border-radius:5px;
}
.cmd-block { margin-top:5px; }
.cmd-label {

  text-transform:uppercase; letter-spacing:.4px;
}
.cmd-row {
  display:flex; align-items:stretch; gap:0;
  border:1px solid var(--border); border-radius:6px; overflow:hidden;
}
.cmd-code {
  flex:1; padding:7px 10px;
  background:rgba(0,0,0,.25); font-family:monospace;
  font-size:11px; color:var(--accent2); line-height:1.5;
  white-space:pre-wrap; word-break:break-all;

}

  color:var(--muted); cursor:pointer; font-size:13px;
  transition:all .15s; flex-shrink:0;
}
.cmd-copy:hover {
  background:rgba(127,119,221,.15); color:var(--accent);
}
</style>
